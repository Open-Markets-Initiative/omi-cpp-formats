name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-14 rapidjson-dev libarrow-dev libparquet-dev libzstd-dev
      - name: Clone captures
        run: git clone --depth=1 https://github.com/Open-Markets-Initiative/omi-data-pcaps.git
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 -DOMI_PACKETS_DIR=omi-data-pcaps
      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
